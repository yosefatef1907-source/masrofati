:root{
 --bg:#F3F6F4;--card:#fff;--ink:#10231D;--mute:#6B7D76;--line:#E3EAE6;
 --brand:#0B5D4B;--brand2:#13A58A;--inc:#12936F;--exp:#E4574B;--warn:#E9A23B;
 --incbg:#E3F5EE;--expbg:#FDEBE9;
 --r:22px;--sh:0 1px 2px rgba(16,35,29,.04),0 8px 24px rgba(16,35,29,.06);
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;justify-content:center}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{width:100%;max-width:480px;height:100%;position:relative;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(110px + var(--sab));display:none}
.screen.on{display:block}
.num{font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate;display:inline-block}

/* hero */
.hero{background:linear-gradient(155deg,#0A4F40 0%,#0B6B56 55%,#13A58A 130%);color:#fff;padding:calc(18px + var(--sat)) 20px 74px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07);top:-90px;left:-70px}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.05);bottom:-80px;right:-40px}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.hello{font-size:13px;opacity:.75;font-weight:600}
.title{font-size:22px;font-weight:800;margin-top:-2px}
.mnav{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.mnav button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff}
.mnav button:active{background:rgba(255,255,255,.2)}
.mnav span{font-weight:700;font-size:14px;min-width:92px;text-align:center}
.bal{display:flex;align-items:center;justify-content:space-between;margin-top:22px;position:relative;z-index:1}
.bal small{font-size:13px;opacity:.8;font-weight:600}
.bal .big{font-size:40px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.bal .big i{font-style:normal;font-size:16px;font-weight:600;opacity:.8;margin-inline-start:6px}
.perday{margin-top:6px;font-size:12.5px;background:rgba(255,255,255,.14);display:inline-block;padding:4px 10px;border-radius:999px;font-weight:600}
.ring{width:92px;height:92px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:800;direction:ltr}
.ring em{position:absolute;inset:0;display:grid;place-items:end center;font-style:normal;font-size:10px;opacity:.75;padding-bottom:20px}

.pull{margin:-48px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:2}
.stat{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.stat .bub{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat.i .bub{background:var(--incbg);color:var(--inc)}
.stat.e .bub{background:var(--expbg);color:var(--exp)}
.stat small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.stat strong{font-size:18px;font-weight:800}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin:14px 16px 0;padding:16px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ch h3{margin:0;font-size:16px;font-weight:800}
.link{color:var(--brand);font-weight:700;font-size:13px}
.pbar{height:10px;background:#EAF0ED;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand2),var(--brand));transition:width .5s}
.pbar.over i{background:linear-gradient(90deg,#F29A4A,var(--exp))}
.brow{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:9px;font-weight:600}
.brow b{color:var(--ink)}
.cta{width:100%;padding:13px;border-radius:14px;background:#EAF5F1;color:var(--brand);font-weight:800;font-size:14px}

.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:start}
.item:first-child{border-top:0}
.item:active{opacity:.6}
.cic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-size:15px;font-weight:700}
.item .mid span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.amt{font-weight:800;font-size:15.5px;white-space:nowrap}
.amt.i{color:var(--inc)}.amt.e{color:var(--exp)}

.cat-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cat-row:last-child{margin-bottom:0}
.cat-row .mid{flex:1}
.cat-row .l{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.cat-row .l span{color:var(--mute);font-weight:600}
.cat-row .pbar{height:7px}
.cat-row .pbar i{background:var(--c)}

.empty{text-align:center;padding:26px 10px;color:var(--mute)}
.empty .cic{margin:0 auto 10px;width:58px;height:58px;background:#EAF5F1;color:var(--brand)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty p{margin:0;font-size:13px;line-height:1.7}

/* tab pages */
.page-h{padding:calc(18px + var(--sat)) 20px 8px}
.page-h h1{margin:0;font-size:26px;font-weight:800}
.seg{display:flex;background:#E6EDE9;border-radius:14px;padding:4px;margin:10px 16px 0}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.search{margin:12px 16px 0;position:relative}
.search input{width:100%;border:0;background:#fff;border-radius:14px;padding:13px 44px 13px 14px;box-shadow:var(--sh);outline:none;font-size:15px}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mute);width:20px;height:20px}
.day{margin:18px 20px 8px;display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:700}
.list{background:var(--card);margin:0 16px;border-radius:var(--r);padding:4px 14px;box-shadow:var(--sh)}

.donutwrap{display:flex;align-items:center;gap:18px}
.donut{width:150px;height:150px;position:relative;flex:none}
.donut b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:19px;font-weight:800;line-height:1.2}
.donut b small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.legend{flex:1;display:grid;gap:8px;font-size:13px;font-weight:600}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend span{margin-inline-start:auto;color:var(--mute)}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:140px;gap:8px;margin-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .pair i{width:38%;max-width:16px;border-radius:6px 6px 3px 3px;min-height:3px}
.bars small{font-size:11px;color:var(--mute);font-weight:700}

.set{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border-top:1px solid var(--line);text-align:start}
.set:first-child{border-top:0}
.set .cic{width:40px;height:40px;border-radius:13px}
.set .mid{flex:1}
.set .mid b{display:block;font-weight:700;font-size:15px}
.set .mid span{font-size:12px;color:var(--mute)}
.set .v{color:var(--mute);font-weight:700;font-size:14px}
.about{text-align:center;color:var(--mute);font-size:12px;margin:22px 0 0}

/* tab bar */
.tabbar{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;padding:8px 6px calc(8px + var(--sab));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:#93A39C;font-size:11px;font-weight:700;padding:4px 0}
.tab.on{color:var(--brand)}
.fab{width:60px;height:60px;border-radius:50%;margin:-30px auto 0;background:linear-gradient(145deg,var(--brand2),var(--brand));color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(11,93,75,.4);border:4px solid var(--bg)}
.fab .ic{width:28px;height:28px;stroke-width:2.4}
.fab:active{transform:scale(.94)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,25,20,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;z-index:50;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:94%;overflow-y:auto;padding:10px 18px calc(18px + var(--sab))}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#D5DEDA;margin:0 auto 12px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-h h2{margin:0;font-size:19px;font-weight:800}
.x{width:34px;height:34px;border-radius:50%;background:#EEF3F0;display:grid;place-items:center}
.bigamt{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 6px;direction:ltr}
.bigamt input{border:0;outline:none;background:none;text-align:center;font-size:46px;font-weight:800;width:200px;direction:ltr;padding:0}
.bigamt span{font-size:18px;font-weight:700;color:var(--mute)}
.bigamt.inc input{color:var(--inc)}.bigamt.exp input{color:var(--exp)}
.lab{font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 8px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:16px;border:2px solid transparent;background:#F3F6F4;font-size:12px;font-weight:700}
.cat .cic{width:38px;height:38px;border-radius:13px}
.cat.on{border-color:var(--brand);background:#fff}
.field{width:100%;border:0;background:#F3F6F4;border-radius:14px;padding:13px 14px;font-size:15px;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{width:100%;margin-top:18px;padding:15px;border-radius:16px;background:linear-gradient(145deg,var(--brand2),var(--brand));color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 18px rgba(11,93,75,.28)}
.save.inc{background:linear-gradient(145deg,#1DB58F,#0F8266)}
.save.exp{background:linear-gradient(145deg,#F0705F,#D8473B);box-shadow:0 8px 18px rgba(216,71,59,.3)}
.del{width:100%;margin-top:10px;padding:13px;border-radius:16px;background:var(--expbg);color:var(--exp);font-weight:800;font-size:14px}
.err{color:var(--exp);font-size:12.5px;font-weight:700;text-align:center;min-height:18px;margin-top:6px}
textarea.field{min-height:110px;direction:ltr;font-size:12px;font-family:monospace}
.toast{position:absolute;left:16px;right:16px;bottom:calc(96px + var(--sab));background:#10231D;color:#fff;border-radius:16px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;z-index:60;transform:translateY(40px);opacity:0;visibility:hidden;transition:transform .3s,opacity .3s,visibility .3s}
.toast.on{transform:none;opacity:1;visibility:visible}
.toast button{color:#7EE3C5;font-weight:800}

input,textarea,select{font-size:16px}
.field,.search input{font-size:16px}
textarea.field{font-size:16px}
.cat{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{flex:none;white-space:nowrap;max-width:45%}
.item .mid b,.cat-row .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal>div:first-child{min-width:0;flex:1}
.stat>div{min-width:0}
.stat strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnav button.mp{width:auto;min-width:104px;padding:0 12px;border-radius:999px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;height:32px}
.mnav button.mp svg,.seg button.mp svg{width:16px;height:16px;display:inline-block;vertical-align:middle;opacity:.8}
.seg button.mp{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.mcat small{display:block;font-size:10px;color:var(--mute);font-weight:600}
.cat.dot{border-color:#CFE3DB}
.tip{background:#EAF5F1;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.7;color:var(--brand);margin:14px 16px 0;position:relative}
.tip b{display:block}
.tip button{color:var(--brand);font-weight:800;font-size:13px;margin-top:4px}
.sheet{overscroll-behavior:contain}
.fun{position:absolute;inset:0;z-index:80;background:rgba(16,35,29,.55);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.fun.on{opacity:1;visibility:visible}
.fun .box{background:#fff;border-radius:28px;padding:26px 22px 20px;text-align:center;width:100%;max-width:340px;transform:scale(.9);transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.fun.on .box{transform:none}
.fun .em{font-size:56px;line-height:1.1}
.fun h3{margin:10px 0 6px;font-size:20px;font-weight:800;line-height:1.5}
.fun p{margin:0 0 16px;color:var(--mute);font-size:13px;line-height:1.7}
.fun button{width:100%;padding:14px;border-radius:16px;background:linear-gradient(145deg,var(--brand2),var(--brand));color:#fff;font-weight:800;font-size:15px}
</style>

 '<div style="display:flex;justify-content:center;margin:6px 0 14px"><span class="cic" style="width:56px;height:56px;border-radius:18px;background:'+tint(e.c)+';color:'+e.c+'">'+ic(e.i)+'</span></div>'+
 '<div class="lab">الاسم</div><input class="field" id="ce-name" maxlength="20" placeholder="اسم التصنيف" value="'+esc(e.n)+'" autocomplete="off">'+
 '<div class="lab" style="margin-top:12px">الأيقونة</div><div class="cats">'+PICK.map(function(k){return '<button class="cat'+(e.i===k?' on':'')+'" data-ci="'+k+'" style="padding:8px 2px"><span class="cic" style="background:'+tint(e.c)+';color:'+e.c+'">'+ic(k)+'</span></button>';}).join('')+'</div>'+
 '<div class="lab" style="margin-top:12px">اللون</div><div class="cats">'+PAL.map(function(k){return '<button class="cat'+(e.c===k?' on':'')+'" data-cc="'+k+'" style="padding:8px 2px"><span class="cic" style="background:'+k+';width:30px;height:30px;border-radius:50%"></span></button>';}).join('')+'</div>'+
 '<div class="err" id="ce-err"></div><button class="save" data-act="saveCat">'+(e.isNew?'إضافة التصنيف':'حفظ')+'</button>'+
 ((!e.isNew&&!locked)?'<button class="del" data-act="delCat">حذف التصنيف</button>':''));
}
function saveCat(){
 ceSync();var e=CE,n=e.n.trim();if(!n){$('ce-err').textContent='اكتب اسم التصنيف';return;}
 var a=arrOf(e.type),rec={id:e.id,n:n,i:e.i,c:e.c,b:tint(e.c)};
 if(e.isNew){var last=a[a.length-1],lk=(last&&(last.id==='other'||last.id==='iother'));if(lk)a.splice(a.length-1,0,rec);else a.push(rec);}
 else{for(var k=0;k<a.length;k++)if(a[k].id===e.id)a[k]=rec;}
 saveCats();
 if(e.ret==='tx'&&ED){ED.type=e.type;ED.cat=rec.id;CE=null;drawTx();render();toast('اتضافت التصنيف');}
 else{render();catsSheet(e.type);toast('اتحفظ التصنيف');}
}
function delCat(){
 var e=CE;if(!e.confirmDel){ceSync();e.confirmDel=true;drawCE();var b=document.querySelector('[data-act="delCat"]');if(b)b.textContent='اضغط تاني للتأكيد (العمليات هتروح لـ "أخرى")';return;}
 var fb=e.type==='income'?'iother':'other';
 S.txs.forEach(function(t){if(t.type===e.type&&t.cat===e.id)t.cat=fb;});
 var a=arrOf(e.type);for(var k=0;k<a.length;k++)if(a[k].id===e.id){a.splice(k,1);break;}
 saveCats();render();catsSheet(e.type);toast('اتحذف التصنيف');
}



/* ---------- funny spending alerts ---------- */
var FUN1=[['😅','يهدي اللعب شويه، لسا الشهر طويل'],['🫠','الجيب بيقولك: خد نفس يا باشا'],['😄','عديت حصة النهاردة، بس هنعديها المرة دي'],['😉','الفلوس مش هتهرب لو سيبتها شوية في المحفظة']];
var FUN2=[['😂','كده كتير يا معلم، المحفظة بتعيط في الركن'],['🙏','بالراحة بقى، لسا فيه أيام كتير قدامنا'],['🥲','هنقفل الشهر على الشاي والعيش؟ هدّي شوية']];
var FUNN=[['👀','ده المصروف رقم %n النهاردة، كفاية كده؟'],['🧐','عمليات كتير النهاردة، الجيب محتاج راحة']];
var funI=0;
function pick(a){funI++;return a[(funI+Math.floor(Math.random()*a.length))%a.length];}
function showFun(m,sub){var f=$('fun');f.innerHTML='<div class="box"><div class="em">'+m[0]+'</div><h3>'+esc(m[1])+'</h3><p>'+sub+'</p><button data-act="funOk">حاضر، هبطّأ 😅</button></div>';f.classList.add('on');}
function funCheck(t){
 if(S.fun===false||t.type!=='expense'||t.date!==ymd(new Date()))return null;
 var now=new Date(),m=ym(now),s0=sums(m),bud=budgetOf(m);
 var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),left=dim-now.getDate()+1;
 var todays=S.txs.filter(function(x){return x.type==='expense'&&x.date===t.date;});
 var before=todays.reduce(function(a,x){return a+x.amount;},0),after=before+t.amount,cnt=todays.length+1;
 var avail=bud>0?(bud-s0.exp+before):(s0.bal+before);
 var A=avail>0?avail/left:0;
 var lv=function(x){return A>0?Math.min(2,Math.floor(x/A)):(x>0?1:0);};
 var sub='صرفت النهاردة <b class="num">'+fmt(after)+'</b> ج.م'+(A>0?' من حصة يومية حوالي <b class="num">'+fmt(A,0)+'</b>':'');
 if(s0.inc>0&&s0.exp+t.amount>s0.inc&&s0.exp<=s0.inc&&bud<=0)return [['✋','المصروفات عدّت الدخل الشهر ده، هدّي شوية'],'مصروفات الشهر عدّت الدخل. لسه فيه وقت نظبطها.'];
 if(lv(after)>lv(before)&&lv(after)>=1)return [pick(lv(after)>=2?FUN2:FUN1),sub];
 if(cnt===4||(cnt>4&&(cnt-4)%4===0)){var q=pick(FUNN);return [[q[0],q[1].replace('%n',cnt)],sub];}
 return null;
}

 '<button class="save" data-act="mpnow" style="background:#EAF5F1;color:var(--brand);box-shadow:none">الرجوع للشهر الحالي</button>');

 openSheet('<div class="sh-h"><h2>اسمك</h2><button class="x" data-act="close">'+ic('x')+'</button></div><div class="lab">هيظهر في الترحيب فوق في الرئيسية.</div><input class="field" id="n-name" maxlength="20" placeholder="مثلاً: يوسف" value="'+esc(S.name||'')+'" autocomplete="off"><button class="save" data-act="saveName">حفظ</button>');

var vv=window.visualViewport;

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-tab],[data-act],[data-m],[data-filter],[data-edit],[data-type],[data-cat],[data-ec],[data-ci],[data-cc],[data-ct],[data-mp],[data-my]');if(!el)return;
 if(ev.target===$('scrim')){closeSheet();return;}
 var d=el.dataset;
 if(d.tab){UI.tab=d.tab;render();$('s-'+d.tab).scrollTop=0;return;}
 if(d.m){UI.month=shiftMonth(UI.month,+d.m);render();return;}
 if(d.filter){UI.filter=d.filter;render();return;}
 if(d.edit){openTx(d.edit);return;}
 if(d.mp){UI.month=d.mp;closeSheet();render();return;}
 if(d.my){MPY+=+d.my;monthPick();return;}
 if(d.ct){catsSheet(d.ct);return;}
 if(d.ec){editCat(d.ec);return;}
 if(d.ci){ceSync();CE.i=d.ci;drawCE();return;}
 if(d.cc){ceSync();CE.c=d.cc;drawCE();return;}
 if(d.type){syncForm();if(ED.type!==d.type){ED.type=d.type;ED.cat=d.type==='income'?'salary':'food';}drawTx();return;}
 if(d.cat){syncForm();ED.cat=d.cat;drawTx();return;}
 switch(d.act){
  case 'add':openTx(null);break;case 'mpick':MPY=+UI.month.slice(0,4);monthPick();break;case 'mpnow':UI.month=ym(new Date());closeSheet();render();break;case 'name':nameSheet();break;case 'saveName':saveName();break;case 'copyBk':copyBk();break;case 'funOk':$('fun').classList.remove('on');break;case 'toggleFun':S.fun=(S.fun===false);save();render();toast(S.fun===false?'اتقفلت تنبيهات الهزار':'اتفتحت تنبيهات الهزار');break;case 'hideInst':UI.hideInst=true;render();break;case 'cats':catsSheet('expense');break;case 'newcatTx':syncForm();newCat(ED.type,'tx');break;case 'newcat':newCat(CT,'list');break;case 'saveCat':saveCat();break;case 'delCat':delCat();break;case 'backCats':catsSheet(CE.type);break;case 'close':closeSheet();break;case 'saveTx':saveTx();break;case 'delTx':delTx();break;
  case 'budget':budgetSheet();break;case 'saveBudget':saveBudget(false);break;case 'clearBudget':saveBudget(true);break;
  case 'backup':backupSheet();break;case 'restore':restore();break;case 'reset':resetSheet();break;
  case 'doReset':S={txs:[],budgets:{},defBudget:0,name:S.name,fun:S.fun};applyCats();save();closeSheet();render();toast('اتمسحت البيانات');break;
  case 'undo':if(undoTx){S.txs.push(undoTx);undoTx=null;save();render();$('toast').classList.remove('on');}break;
 }
});

load();
if(location.search.indexOf('demo')>-1&&!S.txs.length){

 var pm=new Date(n.getFullYear(),n.getMonth()-1,10),pms=ym(pm);S.txs.push({id:uid(),type:'income',cat:'salary',amount:11500,note:'',date:pms+'-05'},{id:uid(),type:'expense',cat:'food',amount:3900,note:'',date:pms+'-12'},{id:uid(),type:'expense',cat:'bills',amount:2600,note:'',date:pms+'-15'});
 memStore[KEY]='demo';
}

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
